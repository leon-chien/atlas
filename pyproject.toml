[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "atlas-world"
version = "0.1.0"
description = "Semantic world-modeling scaffold for interactive simulations from monocular video."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "leon-chien" }]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]
recon = [
  "pycolmap>=3.10",
]
depth = [
  "torch>=2.3",
  "transformers>=4.44",
]
semantics = [
  "torch>=2.3",
  "transformers>=4.44",
]
viewer = [
  "viser>=0.2",
]

[project.scripts]
atlas = "atlas.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "colmap: requires COLMAP or pycolmap",
  "cuda: requires an NVIDIA CUDA runtime",
  "models: requires downloaded model weights",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
